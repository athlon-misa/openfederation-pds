name: Release

on:
  push:
    branches: [main]
  # Manual re-trigger after fixing the publish config, without
  # having to make an empty commit. changeset publish is idempotent:
  # already-published versions are skipped, only unpublished ones retry.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release @open-federation/*
    runs-on: ubuntu-latest
    permissions:
      # Needed for changesets to open the "Version Packages" PR.
      contents: write
      pull-requests: write
      # Required for npm provenance (auto-attested publishes).
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so changesets can diff for unchanged packages.
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate lexicon revisions
        run: npm run lexicon:validate

      - name: Build publishable packages
        run: |
          npm run --workspace @open-federation/sdk build
          npm run --workspace @open-federation/react build
          # build:lexicon also propagates src/lexicon/*.json → packages/openfederation-lexicon/schemas/
          # (both schemas/ and dist/ are .gitignored — must be regenerated each CI run before publish).
          npm run build:lexicon

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0 (v2 needs Changesets CLI v3; this repo uses v2)
        with:
          # Runs `changeset version` + commit to a "Version Packages" PR.
          # When that PR merges back to main, the next run does the publish.
          publish: npx changeset publish
          version: npx changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token: every @open-federation package has a trusted
          # publisher (GitHub Actions, this repository, release.yml), so npm
          # issues a short-lived credential per run through the id-token: write
          # permission above. A new package needs its trusted publisher set on
          # npmjs.com before its first release from here.
          NPM_CONFIG_PROVENANCE: "true"
