name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLC_DIRECTORY_URL: http://127.0.0.1:2582

    strategy:
      # Integration tests are split across three runners per Node version
      # (vitest --shard splits by test file; each file runs exactly once per
      # Node version). Every shard has its own Postgres service and PLC.
      fail-fast: false
      matrix:
        node-version: [22, 24]
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openfederation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build SDK
        run: npm run build:sdk

      - name: Validate lexicon schemas
        run: npm run validate:lexicon

      - name: Validate lexicon revision fields
        run: npm run lexicon:validate

      - name: Check generated lexicon contracts
        run: npm run lexicon:check

      - name: Run unit tests
        run: npm run test:unit
        env:
          AUTH_JWT_SECRET: ci-test-secret-minimum-32-characters-long
          KEY_ENCRYPTION_SECRET: ci-test-encryption-secret-32chars

      - name: Initialize test database schema and run migrations
        run: |
          psql -h localhost -U test -d openfederation_test -f src/db/schema.sql
          for f in scripts/migrate-*.sql; do
            echo "Running $f..."
            psql -h localhost -U test -d openfederation_test -f "$f"
          done
        env:
          PGPASSWORD: test

      - name: Seed bootstrap admin for integration tests
        run: node --import ./scripts/register-ts-node.mjs scripts/seed-bootstrap-admin.ts
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: openfederation_test
          DB_USER: test
          DB_PASSWORD: test
          AUTH_JWT_SECRET: ci-test-secret-minimum-32-characters-long
          KEY_ENCRYPTION_SECRET: ci-test-encryption-secret-32chars
          BOOTSTRAP_ADMIN_HANDLE: admin
          BOOTSTRAP_ADMIN_EMAIL: admin@test.local
          BOOTSTRAP_ADMIN_PASSWORD: Bootstrap-Test-Password-47!

      - name: Start local PLC directory
        run: |
          PORT=2582 node node_modules/@did-plc/server/dist/bin.js \
            > "$RUNNER_TEMP/plc.log" 2>&1 &
          plc_pid=$!
          echo "$plc_pid" > "$RUNNER_TEMP/plc.pid"
          for attempt in {1..30}; do
            if curl --fail --silent "$PLC_DIRECTORY_URL/_health" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$plc_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "PLC directory failed to become healthy"
          cat "$RUNNER_TEMP/plc.log"
          exit 1

      - name: Run integration tests (shard ${{ matrix.shard }} of 3)
        run: npm run test:api -- --shard=${{ matrix.shard }}/3
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          # Tests run against openfederation_test (the Postgres service DB
          # seeded above). setup.ts enforces TEST_DB_NAME !== DB_NAME and
          # then overrides DB_NAME with TEST_DB_NAME — so DB_NAME here is
          # a placeholder that never gets connected to.
          DB_NAME: openfederation_ci_placeholder
          TEST_DB_NAME: openfederation_test
          DB_USER: test
          DB_PASSWORD: test
          AUTH_JWT_SECRET: ci-test-secret-minimum-32-characters-long
          KEY_ENCRYPTION_SECRET: ci-test-encryption-secret-32chars
          BOOTSTRAP_ADMIN_HANDLE: admin
          BOOTSTRAP_ADMIN_EMAIL: admin@test.local
          BOOTSTRAP_ADMIN_PASSWORD: Bootstrap-Test-Password-47!
          PDS_HOSTNAME: localhost
          PDS_SERVICE_URL: http://localhost:8080
          EXPORT_SCHEDULER_ENABLED: "false"

      - name: Stop local PLC directory
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/plc.pid" ]; then
            plc_pid="$(cat "$RUNNER_TEMP/plc.pid")"
            kill "$plc_pid" 2>/dev/null || true
            for attempt in {1..20}; do
              if ! kill -0 "$plc_pid" 2>/dev/null; then
                exit 0
              fi
              sleep 0.1
            done
            kill -KILL "$plc_pid" 2>/dev/null || true
          fi

  # Everything else that ships or deploys: the production Docker image (Railway
  # builds from it), the dashboard, the Matrix bridge and the SIWOF demo.
  builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [docker, web-interface, matrix-bridge, siwof-demo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Docker image
        if: matrix.target == 'docker'
        run: docker build --tag openfederation-pds:ci .
      - name: Dashboard
        if: matrix.target == 'web-interface'
        working-directory: web-interface
        run: npm ci && npm run build
      - name: Matrix bridge
        if: matrix.target == 'matrix-bridge'
        working-directory: bridges/matrix
        run: npm ci && npm run build
      - name: SIWOF demo (needs the local SDK and React packages built)
        if: matrix.target == 'siwof-demo'
        run: |
          npm ci
          (cd packages/openfederation-sdk && npm run build)
          (cd packages/openfederation-react && npm run build)
          cd demos/siwof-dapp && npm ci && npm run build

  # Production dependencies: fail on a high or critical advisory that is not
  # accepted in .github/audit-allowlist.json, and keep a CycloneDX SBOM per
  # project as a build artifact (attached to releases by sbom-release.yml).
  dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [".", web-interface, plc-server, bridges/matrix, demos/siwof-dapp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install exactly the lockfile
        working-directory: ${{ matrix.dir }}
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        working-directory: ${{ matrix.dir }}
        run: npm audit --omit=dev --json | node "$GITHUB_WORKSPACE/scripts/audit-check.mjs"
      - name: CycloneDX SBOM
        working-directory: ${{ matrix.dir }}
        run: |
          name=$(echo "${{ matrix.dir }}" | tr '/' '-' | sed 's/^\.$/pds/')
          npm sbom --sbom-format cyclonedx --sbom-type application --omit dev > "$RUNNER_TEMP/sbom-$name.cdx.json"
          echo "SBOM_FILE=$RUNNER_TEMP/sbom-$name.cdx.json" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ strategy.job-index }}
          path: ${{ env.SBOM_FILE }}

  # One stable check for branch protection: passes only if every job passed.
  ci:
    if: always()
    needs: [build, builds, dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          test "${{ needs.build.result }}" = success
          test "${{ needs.builds.result }}" = success
          test "${{ needs.dependencies.result }}" = success
