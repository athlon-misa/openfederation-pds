# Dependabot: security updates only, one grouped PR per folder.
#
# open-pull-requests-limit: 0 turns off routine version-bump PRs. Dependabot
# still opens a PR when GitHub raises a security alert for a dependency in that
# folder, and the `security` group puts all of a folder's fixes in one PR.
# Version upgrades are done deliberately, by hand.
#
# Workspace packages (packages/*) share the root lockfile, so "/" covers them.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "chore(deps)" }
    groups:
      security: { applies-to: security-updates, patterns: ["*"] }

  - package-ecosystem: npm
    directory: /web-interface
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "chore(deps)" }
    groups:
      security: { applies-to: security-updates, patterns: ["*"] }

  - package-ecosystem: npm
    directory: /plc-server
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "chore(deps)" }
    groups:
      security: { applies-to: security-updates, patterns: ["*"] }

  - package-ecosystem: npm
    directory: /bridges/matrix
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "chore(deps)" }
    groups:
      security: { applies-to: security-updates, patterns: ["*"] }

  - package-ecosystem: npm
    directory: /demos/siwof-dapp
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "chore(deps)" }
    groups:
      security: { applies-to: security-updates, patterns: ["*"] }

  # Workflow actions are pinned by commit SHA; this proposes a PR only when an
  # action has a security advisory.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    commit-message: { prefix: "chore(ci)" }
    groups:
      security: { applies-to: security-updates, patterns: ["*"] }
